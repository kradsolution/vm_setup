# roles/databases/tasks/main.yml 
#================================#

- name: Install databases db_packages
  apt:
    name: "{{ db_packages }}"
    state: present
    update_cache: yes 


- name: Ensure databases services are running 
  service:
   name: "{{ item }}"
   state: started 
   enabled: true
  
  loop:
    - mariadb-server
    - postgresql

